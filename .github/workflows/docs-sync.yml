name: docs-sync

# Keep the visitor-facing status block (version, release date, tests, coverage,
# CI) in README.md / index.html current the moment a release ships. Trigger is
# release-only — a plain push never touches the docs. Opens a PR for review;
# never commits straight to the default branch.
on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      # Pinned to a commit SHA: a branch ref (previously @master) lets the
      # action's owner — or anyone who compromises that repo — run new code in
      # this workflow without a change here.
      - name: Sync docs status block
        uses: Hatemshalaby15071979/Hatemshalaby15071979/.github/actions/docs-sync@aee952f6b4ff2293576e60eedf8e504f9f7deaa2
        with:
          profile: _docs_profile.json
