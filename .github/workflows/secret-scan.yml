name: Secret scan

# gitleaks over the repository. Two shapes of scan:
#   pull_request / push  — the commits introduced by the change
#   schedule / dispatch  — the entire history (fetch-depth: 0)
# A finding fails the job, so a leaked credential cannot land silently.
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks-action reads the PR commit list to pick the range it scans.
  pull-requests: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
          # Findings fail the job; do not spend a token writing a PR comment.
          GITLEAKS_ENABLE_COMMENTS: "false"
