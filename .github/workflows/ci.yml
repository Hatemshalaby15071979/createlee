name: CI

# Branch policy: this repository's default branch is `master` (no `main`). CI runs
# on push and pull_request to ALL branches. This is a verification gate only — a
# green run is not a release or shipment decision. Note: git history is NOT
# rewritten here; changing history requires the owner's explicit G2 authorization.

# WHY THIS WORKFLOW REPLACES python-package-conda.yml
#
# The conda workflow built a conda package and ran security_checks.py. It never
# ran the thing this repository exists to produce: the eight Signoff CSVs and
# the validator that checks them. It also failed on every master run for three
# days (2026-11-07 to 2026-11-10) before two runs passed, so the green was
# meaningless.
#
# This workflow runs the validator over the committed golden examples, fails
# the build on NOT ACCEPTABLE, and runs the platform's own tests (pytest +
# selftest.py) on the Python version declared in environment.yml. Every action
# is pinned to a commit SHA: a moving tag is a supply-chain hole, not a version.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate the eight Signoff CSVs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"

      # The golden examples are the contract: eight CSVs, exact headers,
      # window and control-content checks. NOT ACCEPTABLE fails the build.
      - name: Signoff CSV validator (golden examples)
        run: node opencode_next_step_kit/validate_signoff_csv.mjs opencode_next_step_kit/golden_examples

      # Proves the validator fails closed: a directory that does not exist must
      # exit non-zero. A validator that only ever passes is not a gate.
      - name: Validator fails closed on a missing folder
        run: |
          if node opencode_next_step_kit/validate_signoff_csv.mjs /tmp/definitely-not-here; then
            echo 'validator passed on a missing folder — it is not a gate'
            exit 1
          else
            echo 'validator correctly refused a missing folder'
          fi

      - name: Provenance sidecar is present and machine-readable
        run: node -e "const p=require('./opencode_next_step_kit/provenance.json'); if(p.data_mode!=='synthetic') process.exit(1); if(!p.files||Object.keys(p.files).length!==8) process.exit(1); console.log('provenance ok:', p.files.length ?? Object.keys(p.files).length, 'files')"

  platform:
    name: platform tests (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: Createlee_platform/Createlee
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Tracked secrets / ignored files
        run: python Createlee_platform/Createlee/security_checks.py

      - name: pytest
        working-directory: Createlee_platform/Createlee
        run: python -m pytest -q

      # selftest.py exercises the real Flask app end-to-end (101 checks) and was
      # never wired into CI before, so its regressions went unnoticed.
      - name: selftest
        working-directory: Createlee_platform/Createlee
        run: python selftest.py

      # Manifests must describe the files that are actually committed: the root
      # INDEX.csv shipped as an XLSX workbook with stale hashes for months.
      - name: Verify committed manifests
        run: python tools/verify_manifests.py .

      # Byte-identical files are allowed only for self-contained hand-off packs
      # and the delivered library mirror (see tools/check_duplicates.py).
      - name: Duplicate-file check
        run: python tools/check_duplicates.py .

      # ME-15: agent-directive files must carry the quarantine header so an
      # automated agent does not treat their contents as commands.
      - name: ME-15 agent-instruction guard
        run: python tools/verify_agent_instruction_files.py
